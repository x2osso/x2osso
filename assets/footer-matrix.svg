<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070A">
        <animate attributeName="stop-color" values="#05070A;#090C10;#05070A" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#171C22">
        <animate attributeName="stop-color" values="#171C22;#1E252D;#171C22" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38414B">
        <animate attributeName="stop-color" values="#38414B;#45505C;#38414B" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="footerScan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="170" fill="url(#footerBg)"/>
  <rect width="1200" height="170" fill="url(#footerScan)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- ambient overlays -->
  <rect width="1200" height="170" fill="#FFFFFF" opacity="0.012">
    <animate attributeName="opacity" values="0.012;0.025;0.01;0.018;0.012" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch bars -->
  <g opacity="0.16">
    <rect x="-180" y="34" width="340" height="4" fill="#FFFFFF">
      <animate attributeName="x" values="-180;1280;-180" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0;0.08;0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1280" y="68" width="460" height="3" fill="#D0D7DE">
      <animate attributeName="x" values="1280;-300;1280" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.16;0.02;0.08;0" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-220" y="98" width="520" height="4" fill="#B8C0C8">
      <animate attributeName="x" values="-220;1300;-220" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.13;0;0.07;0" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- japanese rain -->
  <g font-family="monospace" font-size="14" fill="#B8C0C8" opacity="0.13">
    <text x="70" y="-15">雨 システム コード 開発</text>
    <animateTransform attributeName="transform" type="translate" values="0,-15;0,195" dur="6.6s" repeatCount="indefinite"/>
  </g>

  <g font-family="monospace" font-size="13" fill="#8B949E" opacity="0.12">
    <text x="330" y="-28">x2osso 未来 実験 backend</text>
    <animateTransform attributeName="transform" type="translate" values="0,-28;0,200" dur="8.2s" repeatCount="indefinite"/>
  </g>

  <g font-family="monospace" font-size="14" fill="#C9D1D9" opacity="0.11">
    <text x="690" y="-18">人工知能 ゲーム 自動化</text>
    <animateTransform attributeName="transform" type="translate" values="0,-18;0,195" dur="7.4s" repeatCount="indefinite"/>
  </g>

  <g font-family="monospace" font-size="13" fill="#8B949E" opacity="0.12">
    <text x="980" y="-12">コード 雨 雨 雨</text>
    <animateTransform attributeName="transform" type="translate" values="0,-12;0,190" dur="6.8s" repeatCount="indefinite"/>
  </g>

  <!-- floating particles -->
  <g opacity="0.18">
    <circle cx="180" cy="48" r="1.6" fill="#C9D1D9">
      <animate attributeName="cy" values="48;72;48" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="58" r="1.9" fill="#D0D7DE">
      <animate attributeName="cy" values="58;82;58" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="92" r="1.4" fill="#8B949E">
      <animate attributeName="cy" values="92;116;92" dur="6.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- stronger moving waves -->
  <g>
    <g>
      <path d="M-240 62C-120 78 0 88 120 84C240 80 360 60 480 54C600 48 720 58 840 69C960 80 1080 86 1200 82C1320 78 1440 64 1560 56V170H-240V62Z"
            fill="#12171D"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-110 -5;0 0" dur="8.4s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M-260 84C-130 96 0 103 130 100C260 97 390 84 520 79C650 74 780 82 910 91C1040 100 1170 106 1300 103C1430 100 1560 89 1690 82V170H-260V84Z"
            fill="#1D242C" fill-opacity="0.97"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;95 7;0 0" dur="6.2s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M-240 106C-100 112 40 115 180 113C320 111 460 104 600 102C740 100 880 105 1020 110C1160 115 1300 119 1440 117C1580 115 1720 111 1860 106V170H-240V106Z"
            fill="#2C343E" fill-opacity="0.95"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 -4;0 0" dur="4.6s" repeatCount="indefinite"/>
    </g>

    <g opacity="0.5">
      <path d="M-240 126C-90 129 60 130 210 129C360 128 510 125 660 125C810 125 960 128 1110 129C1260 130 1410 132 1560 132C1710 132 1860 130 2010 128V170H-240V126Z"
            fill="#48515D"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;48 3;0 0" dur="3.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- final text -->
  <text x="600" y="146"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#D0D7DE"
        fill-opacity="0.84">
    end_of_file • x2osso • see you, space cowboy...
    <animate attributeName="opacity" values="0.55;0.96;0.62;0.88;0.55" dur="2.8s" repeatCount="indefinite"/>
  </text>
</svg>
